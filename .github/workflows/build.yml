name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack the newest zip
        run: |
          set -e
          newest=$(git log --diff-filter=AM --name-only --format= -- '*.zip' | awk 'NF && !seen[$0]++' | head -1)
          echo "Using zip: $newest"
          mkdir proj
          unzip -oq "$newest" -d proj
          ver=$(grep -m1 "^version" proj/build.gradle || true)
          echo "Zip used: $newest / $ver" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: chainblades-jar
          path: proj/build/libs/*.jar
